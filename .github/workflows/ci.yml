name: CI Quality Gate (Test & Build)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Test & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: 1. Typecheck (TypeScript)
        run: npm run typecheck

      - name: 2. Run Automated Tests
        run: npm test

      - name: 3. Production Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
          CRON_SECRET: "mock_cron_secret"
